                // decorate code blocks
                bubbleDiv.querySelectorAll('pre').forEach(preEl => {
                    const codeEl = preEl.querySelector('code');
                    if (!codeEl) return;
                    hljs.highlightElement(codeEl);

                    let lang = 'text';
                    codeEl.className.split(' ').forEach(cls => {
                        if (cls.startsWith('language-')) lang = cls.replace('language-', '');
                    });
                    const langLabel = lang.charAt(0).toUpperCase() + lang.slice(1);

                    codeEl.style.fontFamily = 'var(--font-mono)';
                    preEl.className = 'code-block-pre';

                    const blockWrapper = document.createElement('div');
                    blockWrapper.className = 'code-block-wrapper';

                    const header = document.createElement('div');
                    header.className = 'code-block-header';
                    header.innerHTML = `
                        <span class="code-lang-tag">${langLabel}</span>
                        <button type="button" class="copy-btn" onclick="copyCode(this)">
                            <i class="far fa-copy" style="font-size:10px"></i> Copy
                        </button>
                    `;

                    preEl.parentNode.insertBefore(blockWrapper, preEl);
                    blockWrapper.appendChild(header);
                    blockWrapper.appendChild(preEl);
                });

                const labelDiv = document.createElement('div');
                labelDiv.className = 'msg-label owl';
                labelDiv.innerHTML = '<i class="fas fa-crow" style="font-size:9px"></i> OWL';

                // Timestamp
                const timestampDiv = document.createElement('div');
                timestampDiv.className = 'msg-timestamp';
                timestampDiv.setAttribute('data-time', fullTimestamp);
                timestampDiv.textContent = timestamp;

                // Actions
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';
                actionsDiv.innerHTML = `
                    <button class="msg-action-btn" onclick="regenerateResponse(this)" title="Regenerate">
                        <i class="fas fa-sync-alt" style="font-size:9px"></i> Regenerate
                    </button>
                    <button class="msg-action-btn" onclick="copyUserMessage(this)" title="Copy">
                        <i class="far fa-copy" style="font-size:9px"></i> Copy
                    </button>
                `;

                wrapper.appendChild(labelDiv);
                wrapper.appendChild(bubbleDiv);
                wrapper.appendChild(timestampDiv);
                wrapper.appendChild(actionsDiv);
                container.appendChild(wrapper);
                if (autoScrollEnabled) {
                    container.scrollTop = container.scrollHeight;
                }
                return;
            }

            container.appendChild(wrapper);
            if (autoScrollEnabled) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // ── Edit Message ────────────────────────────────
        function editMessage(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const bubble = wrapper.querySelector('.msg-bubble-user');
            const originalText = bubble.innerText;
            
            // Replace bubble with textarea
            const textarea = document.createElement('textarea');
            textarea.className = 'edit-textarea';
            textarea.value = originalText;
            textarea.rows = Math.max(2, originalText.split('\n').length);
            
            // Add edit actions
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'edit-actions';
            actionsDiv.innerHTML = `
                <button class="edit-cancel-btn" onclick="cancelEdit(this)">Cancel</button>
                <button class="edit-save-btn" onclick="saveEdit(this)">Save & Send</button>
            `;
            
            bubble.style.display = 'none';
            bubble.parentNode.insertBefore(textarea, bubble.nextSibling);
            textarea.parentNode.insertBefore(actionsDiv, textarea.nextSibling);
            
            textarea.focus();
        }

        function cancelEdit(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const bubble = wrapper.querySelector('.msg-bubble-user');
            const textarea = wrapper.querySelector('.edit-textarea');
            const actions = wrapper.querySelector('.edit-actions');
            
            bubble.style.display = 'block';
            textarea.remove();
            actions.remove();
        }

        function saveEdit(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const textarea = wrapper.querySelector('.edit-textarea');
            const newText = textarea.value.trim();
            
            if (!newText) return;
            
            // Remove the edited message and all subsequent messages
            const container = document.getElementById('chat-messages');
            const allWrappers = container.querySelectorAll('.msg-wrapper');
            let found = false;
            allWrappers.forEach(w => {
                if (w === wrapper) found = true;
                if (found) w.remove();
            });
            
            // Send new message
            document.getElementById('prompt-input').value = newText;
            document.getElementById('generation-form').requestSubmit();
        }

        // ── Regenerate Response ─────────────────────────
        function regenerateResponse(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const container = document.getElementById('chat-messages');
            
            // Find the last user message before this assistant message
            const allWrappers = container.querySelectorAll('.msg-wrapper');
            let lastUserMessage = null;
            
            for (let i = allWrappers.length - 1; i >= 0; i--) {
                if (allWrappers[i] === wrapper) continue;
                if (allWrappers[i].classList.contains('user')) {
                    lastUserMessage = allWrappers[i];
                    break;
                }
            }
            
            if (!lastUserMessage) return;
            
            const bubble = lastUserMessage.querySelector('.msg-bubble-user');
            const prompt = bubble.innerText;
            
            // Remove all messages from this assistant message onwards
            let found = false;
            allWrappers.forEach(w => {
                if (w === wrapper) found = true;
                if (found) w.remove();
            });
            
            // Resend the message
            document.getElementById('prompt-input').value = prompt;
            document.getElementById('generation-form').requestSubmit();
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function copyCode(btn) {
            const pre = btn.closest('.code-block-wrapper').querySelector('pre code');
            if (!pre) return;
            try {
                await navigator.clipboard.writeText(pre.innerText);
                btn.classList.add('copied');
                btn.innerHTML = '<i class="fas fa-check" style="font-size:10px;color:var(--green)"></i> Copied!';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<i class="far fa-copy" style="font-size:10px"></i> Copy';
                }, 2000);
            } catch (e) { console.error(e); }
        }

        
        async function copyUserMessage(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const bubble = wrapper.querySelector('.msg-bubble-user, .msg-bubble-assistant');
            const text = bubble ? bubble.innerText : btn.getAttribute('data-content');
            try {
                await navigator.clipboard.writeText(text);
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check" style="font-size:10px;color:var(--green)"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                }, 2000);
            } catch(e) { console.error(e); }
        }

        async function retryMessage(btn) {
            const wrapper = btn.closest('.msg-wrapper');
            const bubble = wrapper.querySelector('.msg-bubble-user');
            const prompt = bubble ? bubble.innerText : btn.getAttribute('data-prompt');
            
            if (!prompt || !activeSessionId) return;

            // remove last assistant response if exists
            const messages = document.getElementById('chat-messages');
            const allWrappers = messages.querySelectorAll('.msg-wrapper');
            const lastWrapper = allWrappers[allWrappers.length - 1];
            if (lastWrapper && lastWrapper.classList.contains('assistant')) {
                lastWrapper.remove();
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner" style="animation:spin 0.8s linear infinite;font-size:12px"></i>';

            const typingEl = showTypingIndicator();

            try {
                const response = await fetch(`/api/chat/${activeSessionId}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) throw new Error("Backend error.");
                const data = await response.json();

                if (data.status === 'processing' && data.message_id) {
                    // Poll until done — survives refresh because work is in background
                    pollMessageStatus(data.message_id, typingEl);
                } else {
                    const reply = data.response || data.content || "No response received.";
                    removeTypingIndicator(typingEl);
                    appendMessageBubble('assistant', reply);
                }

            } catch (err) {
                console.error("[SUBMIT-ERROR]", err);
                removeTypingIndicator(typingEl);
                appendMessageBubble('assistant', '⚠️ **Connection error.** Could not reach the backend. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="font-size:12px"></i>';
            }
        }        


        // ── HYDRATE MESSAGES ─────────────────────────────
        async function hydrateExistingMessages(sessionId) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            try {
                const res = await fetch(`/api/chat/${sessionId}/messages`);
                const messages = await res.json();
                if (messages.length === 0) {
                    showEmptyState();
                    return;
                }
                messages.forEach(m => {
                    if (m.status === 'pending' && m.role === 'assistant') {
                        const typingEl = showTypingIndicator();
                        pollMessageStatus(m.id, typingEl);
                    } else if (m.content) {
                        appendMessageBubble(m.role, m.content, m.id);
                    }
                });
                if (autoScrollEnabled) {
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) { console.error('[HYDRATE]', e); }
        }

        // ── SESSION MANAGEMENT ───────────────────────────
        async function createNewSession() {
            try {
                const res  = await fetch('/api/chat/new', { method: 'POST' });
                const data = await res.json();
                window.location.href = `/chat/${data.session_id}`;
            } catch (e) { console.error('[NEW-SESSION]', e); }
        }

        function toggleActionDropdown(event, chatId) {
            event.stopPropagation();
            document.querySelectorAll('[id^="dropdown-"]').forEach(d => {
                if (d.id !== `dropdown-${chatId}`) d.classList.add('hidden');
            });
            document.getElementById(`dropdown-${chatId}`).classList.toggle('hidden');
        }

        function openRenameModal(event, el) {
            event.stopPropagation();
            currentEditingChatId = el.getAttribute('data-id');
            originalChatTitle    = el.getAttribute('data-title').trim();

            const input = document.getElementById('modal-title-input');
            input.value = originalChatTitle;
            document.getElementById('modal-save-btn').disabled = true;

            document.getElementById('gemini-modal-backdrop').classList.add('open');
            input.focus();
            input.select();
        }

        function closeRenameModal() {
            document.getElementById('gemini-modal-backdrop').classList.remove('open');
            currentEditingChatId = null;
            originalChatTitle    = "";
        }

        async function submitRenamePipeline() {
            const newTitle = document.getElementById('modal-title-input').value.trim();
            if (!newTitle || newTitle === originalChatTitle || !currentEditingChatId) return;

            try {
                const res = await fetch(`/api/chat/${currentEditingChatId}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });
                if (!res.ok) throw new Error();

                const titleSpan = document.getElementById(`session-text-${currentEditingChatId}`);
                if (titleSpan) titleSpan.textContent = newTitle;

                const actionBtn = document.querySelector(`button[data-id="${currentEditingChatId}"]`);
                if (actionBtn) actionBtn.setAttribute('data-title', newTitle);

                closeRenameModal();
            } catch (e) { console.error('[RENAME]', e); }
        }

        async function triggerDeletePipeline(event, chatId) {
            event.stopPropagation();
            if (!confirm('Delete this session?')) return;
            try {
                const res = await fetch(`/api/chat/${chatId}/delete`, { method: 'POST' });
                if (!res.ok) throw new Error();
                document.getElementById(`session-item-${chatId}`).remove();
                if (activeSessionId == chatId) window.location.href = '/';
            } catch (e) { console.error('[DELETE]', e); }
        }

        // CSS spin keyframe injection
        const styleEl = document.createElement('style');
        styleEl.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(styleEl);

        function pollMessageStatus(messageId, typingEl) {
            const POLL_INTERVAL_MS = 3000;  // از 2 ثانیه به 3 ثانیه
            const MAX_ATTEMPTS = 300;       // از 150 به 300 (15 دقیقه)
            let attempts = 0;
            let stopped = false;

            const interval = setInterval(async () => {
                if (stopped) { clearInterval(interval); return; }
                attempts++;
                if (attempts > MAX_ATTEMPTS) {
                    clearInterval(interval);
                    removeTypingIndicator(typingEl);
                    appendMessageBubble('assistant', '⚠️ **Timeout.** The response took too long. Please try again or check your connection.');
                    return;
                }
                try {
                    const res = await fetch(`/api/message/${messageId}/status`);
                    if (!res.ok) return;
                    const data = await res.json();
                    console.log(`[POLL] attempt=${attempts} status=${data.status}`);
                    if (data.status === 'done' || data.status === 'error') {
                        clearInterval(interval);
                        removeTypingIndicator(typingEl);
                        appendMessageBubble('assistant', data.content || '⚠️ Empty response.');
                    }
                } catch (e) { console.warn('[POLL] hiccup:', e); }
            }, POLL_INTERVAL_MS);

            // attach interval ref to typingEl for stop button
            if (typingEl) typingEl._pollInterval = interval;
            if (typingEl) typingEl._stopped = () => { stopped = true; };
        }

        function stopPolling(btn) {
            const wrapper = btn.closest('.typing-indicator-wrapper');
            if (!wrapper) return;
            if (wrapper._stopped) wrapper._stopped();
            if (wrapper._pollInterval) clearInterval(wrapper._pollInterval);
            removeTypingIndicator(wrapper);
            appendMessageBubble('assistant', '⏹ *Generation stopped by user.*');
        }

        // ── SETTINGS MODAL ───────────────────────────
        function openSettingsModal() {
            document.getElementById('settings-modal-backdrop').classList.add('open');
            loadActiveInstruction();
            loadInstructionsList();
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal-backdrop').classList.remove('open');
            currentEditingInstructionId = null;
        }

        function switchSettingsTab(tab, btn) {
            document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.settings-tab-content').forEach(c => c.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(`settings-tab-${tab}`).classList.add('active');
        }

        // Load active instruction
        async function loadActiveInstruction() {
            try {
                const res = await fetch('/api/instructions/active');
                const data = await res.json();
                
                document.getElementById('instruction-title').value = data.title;
                document.getElementById('instruction-content').value = data.content;
                document.getElementById('instruction-active').checked = data.is_active;
                currentEditingInstructionId = data.id;
            } catch (e) {
                console.error('[LOAD-INSTRUCTION]', e);
            }
        }

        // Save instruction
        async function saveInstruction() {
            const title = document.getElementById('instruction-title').value.trim();
            const content = document.getElementById('instruction-content').value.trim();
            const isActive = document.getElementById('instruction-active').checked;
            
            if (!title || !content) {
                alert('Title and content are required!');
                return;
            }
            
            try {
                let res;
                if (currentEditingInstructionId) {
                    res = await fetch(`/api/instructions/${currentEditingInstructionId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content, is_active: isActive })
                    });
                } else {
                    res = await fetch('/api/instructions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content, is_active: isActive })
                    });
                }
                
                if (res.ok) {
                    alert('Instruction saved successfully!');
                    loadInstructionsList();
                } else {
                    throw new Error('Failed to save');
                }
            } catch (e) {
                console.error('[SAVE-INSTRUCTION]', e);
                alert('Failed to save instruction.');
            }
        }

        // Reset to default
        async function resetToDefault() {
            if (!confirm('Reset to default instructions? This will overwrite current content.')) return;
            
            try {
                const res = await fetch('/api/instructions/initialize-default', { method: 'POST' });
                if (res.ok) {
                    loadActiveInstruction();
                    alert('Default instructions restored!');
                }
            } catch (e) {
                console.error('[RESET-INSTRUCTION]', e);
            }
        }

        // Load instructions list
        async function loadInstructionsList() {
            try {
                const res = await fetch('/api/instructions');
                const instructions = await res.json();
                
                const listContainer = document.getElementById('instructions-list');
                listContainer.innerHTML = instructions.map(inst => `
                    <div class="settings-list-item ${inst.is_active ? 'active' : ''}">
                        <div class="settings-list-item-header">
                            <span class="settings-list-item-title">${escapeHtml(inst.title)}</span>
                            ${inst.is_active ? '<span class="settings-list-item-badge">Active</span>' : ''}
                        </div>
                        <div class="settings-list-item-preview">${escapeHtml(inst.content.substring(0, 100))}...</div>
                        <div class="settings-list-item-actions">
                            <button class="settings-list-item-btn edit" onclick="editInstruction(${inst.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            ${!inst.is_active ? `
                                <button class="settings-list-item-btn activate" onclick="activateInstruction(${inst.id})">
                                    <i class="fas fa-check"></i> Activate
                                </button>
                            ` : ''}
                            <button class="settings-list-item-btn delete" onclick="deleteInstruction(${inst.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('[LOAD-INSTRUCTIONS]', e);
            }
        }

        // Edit instruction
        async function editInstruction(id) {
            try {
                const res = await fetch(`/api/instructions/${id}`);
                const data = await res.json();
                
                document.getElementById('instruction-title').value = data.title;
                document.getElementById('instruction-content').value = data.content;
                document.getElementById('instruction-active').checked = data.is_active;
                currentEditingInstructionId = id;
                
                // Switch to current tab
                document.querySelectorAll('.settings-tab')[0].click();
            } catch (e) {
                console.error('[EDIT-INSTRUCTION]', e);
            }
        }

        // Activate instruction
        async function activateInstruction(id) {
            try {
                const res = await fetch(`/api/instructions/${id}/activate`, { method: 'POST' });
                if (res.ok) {
                    loadInstructionsList();
                    loadActiveInstruction();
                }
            } catch (e) {
                console.error('[ACTIVATE-INSTRUCTION]', e);
            }
        }

        // Delete instruction
        async function deleteInstruction(id) {
            if (!confirm('Delete this instruction?')) return;
            
            try {
                const res = await fetch(`/api/instructions/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadInstructionsList();
                }
            } catch (e) {
                console.error('[DELETE-INSTRUCTION]', e);
            }
        }

        // Create new instruction
        function createNewInstruction() {
            currentEditingInstructionId = null;
            document.getElementById('instruction-title').value = '';
            document.getElementById('instruction-content').value = '';
            document.getElementById('instruction-active').checked = false;
            
            // Switch to current tab
            document.querySelectorAll('.settings-tab')[0].click();
        }

        // Close settings modal on outside click
        document.getElementById('settings-modal-backdrop').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeSettingsModal();
            }
        });
        // ── Mobile Sidebar ─────────────────────────
        function toggleMobileSidebar() {
            const aside = document.querySelector('aside');
            const overlay = document.getElementById('sidebar-overlay');
            aside.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // ── Show More for Long Prompts ──────────────
        function toggleShowMore(btn) {
            const bubble = btn.closest('.msg-bubble-user');
            const isCollapsed = bubble.classList.contains('collapsed');
            
            if (isCollapsed) {
                bubble.classList.remove('collapsed');
                btn.innerHTML = '<i class="fas fa-chevron-up" style="font-size:8px"></i> Show Less';
            } else {
                bubble.classList.add('collapsed');
                btn.innerHTML = '<i class="fas fa-chevron-down" style="font-size:8px"></i> Show More';
            }
        }
    </script>
</body>
