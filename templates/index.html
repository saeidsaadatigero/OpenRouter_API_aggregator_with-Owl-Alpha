<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL Studio — Intelligence Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-base:      #0d0d14;
            --bg-surface:   #13131f;
            --bg-elevated:  #1a1a2a;
            --bg-hover:     #1f1f32;
            --border:       #252538;
            --border-light: #2e2e4a;
            --accent:       #7c6af7;
            --accent-soft:  #9d8fff;
            --accent-glow:  rgba(124,106,247,0.18);
            --accent-glow2: rgba(124,106,247,0.08);
            --green:        #3dd68c;
            --green-glow:   rgba(61,214,140,0.15);
            --red:          #f0567a;
            --yellow:       #f5c542;
            --cyan:         #56d4f0;
            --text-primary: #e8e8f0;
            --text-muted:   #7070a0;
            --text-dim:     #404060;
            --font-ui:      'Syne', sans-serif;
            --font-mono:    'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* ── SIDEBAR ─────────────────────────────── */
        aside {
            width: 272px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
        }

        aside::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent, var(--accent) 40%, var(--cyan) 70%, transparent);
            opacity: 0.25;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            color: #fff;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.03em;
            padding: 11px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(124,106,247,0.3);
            position: relative;
            overflow: hidden;
        }

        .new-chat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(124,106,247,0.4); }
        .new-chat-btn:hover::before { opacity: 1; }
        .new-chat-btn:active { transform: translateY(0); }

        .sessions-nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px;
        }

        .session-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 9px;
            padding: 9px 12px;
            margin-bottom: 2px;
            transition: all 0.18s ease;
            cursor: pointer;
        }

        .session-item:not(.active):hover { background: var(--bg-hover); }

        .session-item.active {
            background: var(--accent-glow);
            border: 1px solid rgba(124,106,247,0.3);
        }

        .session-item.active .session-title { color: var(--accent-soft); }

        .session-link {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            overflow: hidden;
            padding-right: 28px;
        }

        .session-item.active .session-link { color: var(--accent-soft); }
        .session-link:hover { color: var(--text-primary); }

        .session-icon {
            width: 22px; height: 22px;
            border-radius: 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 9px;
            color: var(--text-dim);
            transition: all 0.15s;
        }

        .session-item.active .session-icon {
            background: var(--accent-glow);
            border-color: rgba(124,106,247,0.4);
            color: var(--accent-soft);
        }

        .session-actions {
            position: absolute;
            right: 8px;
            opacity: 0;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
        }

        .session-item:hover .session-actions { opacity: 1; }

        .action-dot-btn {
            width: 24px; height: 24px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
            transition: all 0.15s;
        }

        .action-dot-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

        .dropdown-menu {
            position: absolute;
            right: 0; top: 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            padding: 6px;
            width: 140px;
            z-index: 100;
        }

        .dropdown-item {
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            font-family: var(--font-ui);
            font-weight: 500;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--bg-hover); }
        .dropdown-item.rename { color: var(--text-primary); }
        .dropdown-item.delete { color: var(--red); }

        .sidebar-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            display: flex; align-items: center; gap: 7px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse-green 2.5s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
            50% { opacity: 0.6; box-shadow: 0 0 16px var(--green); }
        }

        /* ── MAIN ────────────────────────────────── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-base);
            position: relative;
            overflow: hidden;
        }

        /* subtle grid bg */
        main::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.18;
            pointer-events: none;
        }

        /* ── HEADER ──────────────────────────────── */
        header {
            height: 58px;
            border-bottom: 1px solid var(--border);
            background: rgba(13,13,20,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 2px 12px rgba(124,106,247,0.4);
        }

        .header-title {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-session-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--cyan);
            background: rgba(86,212,240,0.08);
            border: 1px solid rgba(86,212,240,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.05em;
        }

        /* ── MESSAGES ────────────────────────────── */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 780px;
            animation: msg-in 0.3s cubic-bezier(0.2, 0, 0, 1) both;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.user { margin-left: auto; align-items: flex-end; }
        .msg-wrapper.assistant { margin-right: auto; align-items: flex-start; }

        .msg-bubble-user {
            background: linear-gradient(135deg, var(--accent) 0%, #5b4fcf 100%);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            padding: 12px 18px;
            font-size: 13.5px;
            line-height: 1.6;
            box-shadow: 0 4px 24px rgba(124,106,247,0.25);
            max-width: 580px;
            word-break: break-word;
            user-select: text;
        }

        .msg-bubble-assistant {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 4px 16px 16px 16px;
            padding: 16px 20px;
            font-size: 13.5px;
            line-height: 1.7;
            width: 100%;
            user-select: text;
            position: relative;
        }

        .msg-bubble-assistant::before {
            content: '';
            position: absolute;
            left: -1px; top: 0; bottom: 0;
            width: 2px;
            border-radius: 0 0 0 4px;
            background: linear-gradient(180deg, var(--accent), var(--cyan));
            opacity: 0.6;
        }

        /* assistant label */
        .msg-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-label.owl { color: var(--accent-soft); }
        .msg-label.you { color: var(--text-dim); }

        /* markdown inside assistant bubbles */
        .msg-bubble-assistant h1, .msg-bubble-assistant h2, .msg-bubble-assistant h3 {
            font-family: var(--font-ui);
            font-weight: 700;
            margin: 16px 0 8px;
            color: var(--text-primary);
        }

        .msg-bubble-assistant h1 { font-size: 18px; }
        .msg-bubble-assistant h2 { font-size: 15px; }
        .msg-bubble-assistant h3 { font-size: 13px; color: var(--accent-soft); }

        .msg-bubble-assistant p { margin: 0 0 10px; color: var(--text-primary); }
        .msg-bubble-assistant p:last-child { margin-bottom: 0; }

        .msg-bubble-assistant ul, .msg-bubble-assistant ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .msg-bubble-assistant li { margin: 4px 0; color: var(--text-primary); }

        .msg-bubble-assistant code:not(pre code) {
            font-family: var(--font-mono);
            font-size: 12px;
            background: rgba(124,106,247,0.12);
            border: 1px solid rgba(124,106,247,0.2);
            color: var(--accent-soft);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .msg-bubble-assistant a { color: var(--cyan); text-decoration: underline; }

        .hljs { background: #0d0d18 !important; color: #cdd6f4 !important; padding: 0 !important; }

        /* code block */
        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0d18;
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .code-lang-tag {
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .copy-btn {
            display: flex; align-items: center; gap: 6px;
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.05em;
        }

        .copy-btn:hover { background: var(--accent-glow2); border-color: var(--accent); color: var(--accent-soft); }
        .copy-btn.copied { color: var(--green); border-color: var(--green); }

        .code-block-pre {
            background: #0d0d18 !important;
            overflow-x: auto;
            padding: 16px !important;
            margin: 0 !important;
            border-radius: 0 !important;
            font-family: var(--font-mono) !important;
            font-size: 12.5px !important;
            line-height: 1.65 !important;
        }

        /* ── TYPING INDICATOR ────────────────────── */
        .typing-indicator-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 780px;
            margin-right: auto;
            align-items: flex-start;
            animation: msg-in 0.3s ease both;
        }

        .typing-bubble {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            min-width: 180px;
        }

        .typing-bubble::before {
            content: '';
            position: absolute;
            left: -1px; top: 0; bottom: 0;
            width: 2px;
            border-radius: 0 0 0 4px;
            background: linear-gradient(180deg, var(--accent), var(--cyan));
            opacity: 0.6;
        }

        .typing-dots {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .typing-text {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        /* wave bar animation */
        .typing-bars {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .typing-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: bar-wave 1.2s infinite ease-in-out;
        }

        .typing-bar:nth-child(1) { animation-delay: 0s;    height: 8px; }
        .typing-bar:nth-child(2) { animation-delay: 0.15s; height: 14px; }
        .typing-bar:nth-child(3) { animation-delay: 0.3s;  height: 20px; }
        .typing-bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
        .typing-bar:nth-child(5) { animation-delay: 0.6s;  height: 8px; }

        @keyframes bar-wave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
            50%       { transform: scaleY(1);   opacity: 1; }
        }

        /* ── EMPTY STATE ─────────────────────────── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
        }

        .empty-state-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: var(--text-dim);
        }

        .empty-state-text {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        /* ── FOOTER / INPUT ──────────────────────── */
        footer {
            padding: 16px 48px 20px;
            background: rgba(13,13,20,0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            z-index: 10;
            position: relative;
        }

        .input-form { max-width: 780px; margin: 0 auto; }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 10px 10px 10px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(124,106,247,0.5);
            box-shadow: 0 0 0 3px var(--accent-glow2), 0 4px 24px rgba(0,0,0,0.2);
        }

        #prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font-ui);
            font-size: 13.5px;
            color: var(--text-primary);
            resize: none;
            min-height: 20px;
            max-height: 160px;
            line-height: 1.5;
            padding: 4px 0;
        }

        #prompt-input::placeholder { color: var(--text-dim); }

        #submit-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 2px 12px rgba(124,106,247,0.35);
        }

        #submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,247,0.5); }
        #submit-btn:active:not(:disabled) { transform: translateY(0); }
        #submit-btn:disabled { opacity: 0.7; cursor: default; }

        .input-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 8px;
            letter-spacing: 0.05em;
        }

        /* ── MODAL ───────────────────────────────── */
        #gemini-modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #gemini-modal-backdrop.open { display: flex; }

        .modal-surface {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: modal-in 0.2s cubic-bezier(0.2, 0, 0, 1) both;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        .modal-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow2); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        .modal-btn-cancel {
            padding: 9px 18px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .modal-btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }

        .modal-btn-save {
            padding: 9px 22px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 12px rgba(124,106,247,0.3);
        }

        .modal-btn-save:disabled { opacity: 0.4; cursor: default; }
        .modal-btn-save:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,247,0.45); }
    </style>
</head>
<body>

    <!-- ── SIDEBAR ─────────────────────────────── -->
    <aside>
        <div class="sidebar-header">
            <button onclick="createNewSession()" class="new-chat-btn">
                <i class="fas fa-plus" style="font-size:11px"></i>
                New Session
            </button>
        </div>

        <nav class="sessions-nav" id="sessions-container">
            {% for chat in recent_chats %}
            <div id="session-item-{{ chat.id }}"
                 class="session-item {% if chat.id == active_session_id %}active{% endif %}">
                <a href="/chat/{{ chat.id }}" class="session-link">
                    <div class="session-icon">
                        <i class="fas fa-terminal"></i>
                    </div>
                    <span id="session-text-{{ chat.id }}" class="session-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                        {{ chat.title or 'Untitled Session' }}
                    </span>
                </a>

                <div class="session-actions">
                    <button onclick="toggleActionDropdown(event, {{ chat.id }})" class="action-dot-btn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <div id="dropdown-{{ chat.id }}" class="dropdown-menu hidden">
                        <button data-id="{{ chat.id }}" data-title="{{ chat.title or '' }}"
                                onclick="openRenameModal(event, this)"
                                class="dropdown-item rename">
                            <i class="fas fa-pen" style="color:var(--yellow);font-size:10px"></i> Rename
                        </button>
                        <button onclick="triggerDeletePipeline(event, {{ chat.id }})"
                                class="dropdown-item delete">
                            <i class="fas fa-trash-alt" style="font-size:10px"></i> Delete
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </nav>

        <div class="sidebar-footer">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>ONLINE</span>
            </div>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">OWL v2.0</span>
        </div>
    </aside>

    <!-- ── MAIN ───────────────────────────────── -->
    <main>
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <i class="fas fa-crow"></i>
                </div>
                <span class="header-title">Intelligence Terminal</span>
                {% if active_session_id %}
                <span class="header-session-id">SID:{{ active_session_id }}</span>
                {% endif %}
            </div>
            <div class="header-right">
                <span class="model-badge">Owl-Alpha/ Chat</span>
            </div>
        </header>

        <div id="chat-messages"></div>

        <footer>
            <form id="generation-form" class="input-form">
                <div class="input-container">
                    <textarea id="prompt-input" rows="1"
                        placeholder="Ask anything or request code generation..."
                        required></textarea>
                    <button type="submit" id="submit-btn">
                        <i class="fas fa-paper-plane" style="font-size:12px"></i>
                    </button>
                </div>
                <p class="input-hint">Enter ↵ to send &nbsp;·&nbsp; Shift+Enter for new line</p>
            </form>
        </footer>
    </main>

    <!-- ── RENAME MODAL ───────────────────────── -->
    <div id="gemini-modal-backdrop">
        <div class="modal-surface" id="gemini-modal-surface">
            <p class="modal-title">Rename session</p>
            <input type="text" id="modal-title-input" maxlength="128"
                   autocomplete="off" class="modal-input"
                   placeholder="Session title...">
            <div class="modal-actions">
                <button onclick="closeRenameModal()" class="modal-btn-cancel">Cancel</button>
                <button id="modal-save-btn" onclick="submitRenamePipeline()"
                        disabled class="modal-btn-save">Save</button>
            </div>
        </div>
    </div>

    <script>
        const activeSessionId = "{{ active_session_id or '' }}";
        let currentEditingChatId = null;
        let originalChatTitle = "";

        // ── marked + hljs setup ──────────────────────────
        marked.setOptions({
            highlight: (code, lang) =>
                hljs.highlight(code, { language: hljs.getLanguage(lang) ? lang : 'plaintext' }).value,
            langPrefix: 'hljs language-'
        });

        // ── DOMContentLoaded ─────────────────────────────
        document.addEventListener("DOMContentLoaded", () => {
            if (activeSessionId) hydrateExistingMessages(activeSessionId);

            document.addEventListener('click', () => {
                document.querySelectorAll('[id^="dropdown-"]').forEach(d => d.classList.add('hidden'));
            });

            document.getElementById('modal-title-input').addEventListener('input', (e) => {
                const val = e.target.value.trim();
                document.getElementById('modal-save-btn').disabled =
                    (val === "" || val === originalChatTitle);
            });

            // auto-resize textarea
            const promptArea = document.getElementById('prompt-input');
            promptArea.addEventListener('input', () => {
                promptArea.style.height = 'auto';
                promptArea.style.height = Math.min(promptArea.scrollHeight, 160) + 'px';
            });

            // keyboard submit
            promptArea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('generation-form').requestSubmit();
                }
            });

            // form submit
            document.getElementById('generation-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const promptInput = document.getElementById('prompt-input');
                const submitBtn   = document.getElementById('submit-btn');
                const promptText  = promptInput.value.trim();

                if (!promptText || !activeSessionId) return;

                appendMessageBubble('user', promptText);
                promptInput.value = '';
                promptInput.style.height = 'auto';

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner" style="animation:spin 0.8s linear infinite;font-size:12px"></i>';

                // show typing indicator
                const typingEl = showTypingIndicator();

                try {
                    const response = await fetch(`/api/chat/${activeSessionId}/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: promptText })
                    });

                    if (!response.ok) throw new Error("Backend error.");

                    const data = await response.json();
                    const reply = data.response || data.content || "No response received.";

                    removeTypingIndicator(typingEl);
                    appendMessageBubble('assistant', reply);

                } catch (err) {
                    console.error("[SUBMIT-ERROR]", err);
                    removeTypingIndicator(typingEl);
                    appendMessageBubble('assistant',
                        '⚠️ **Connection error.** Could not reach the backend. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="font-size:12px"></i>';
                }
            });
        });

        // ── TYPING INDICATOR ─────────────────────────────
        function showTypingIndicator() {
            const container = document.getElementById('chat-messages');

            // remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = 'typing-indicator-wrapper';
            wrapper.id = 'typing-indicator';

            wrapper.innerHTML = `
                <div class="msg-label owl">
                    <i class="fas fa-crow" style="font-size:9px"></i> OWL
                </div>
                <div class="typing-bubble">
                    <div class="typing-bars">
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                    </div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span class="typing-text">Generating response...</span>
                </div>
            `;

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            return wrapper;
        }

        function removeTypingIndicator(el) {
            if (el && el.parentNode) el.remove();
        }

        // ── MESSAGE BUBBLE ───────────────────────────────
        function appendMessageBubble(role, content) {
            const container = document.getElementById('chat-messages');

            // remove empty state
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${role}`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="msg-label you">
                        <i class="fas fa-user" style="font-size:8px"></i> You
                    </div>
                    <div class="msg-bubble-user">${escapeHtml(content)}</div>
                `;
            } else {
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'msg-bubble-assistant markdown-body';
                bubbleDiv.innerHTML = marked.parse(content);

                // decorate code blocks
                bubbleDiv.querySelectorAll('pre').forEach(preEl => {
                    const codeEl = preEl.querySelector('code');
                    if (!codeEl) return;
                    hljs.highlightElement(codeEl);

                    let lang = 'text';
                    codeEl.className.split(' ').forEach(cls => {
                        if (cls.startsWith('language-')) lang = cls.replace('language-', '');
                    });
                    const langLabel = lang.charAt(0).toUpperCase() + lang.slice(1);

                    codeEl.style.fontFamily = 'var(--font-mono)';
                    preEl.className = 'code-block-pre';

                    const blockWrapper = document.createElement('div');
                    blockWrapper.className = 'code-block-wrapper';

                    const header = document.createElement('div');
                    header.className = 'code-block-header';
                    header.innerHTML = `
                        <span class="code-lang-tag">${langLabel}</span>
                        <button type="button" class="copy-btn" onclick="copyCode(this)">
                            <i class="far fa-copy" style="font-size:10px"></i> Copy
                        </button>
                    `;

                    preEl.parentNode.insertBefore(blockWrapper, preEl);
                    blockWrapper.appendChild(header);
                    blockWrapper.appendChild(preEl);
                });

                const labelDiv = document.createElement('div');
                labelDiv.className = 'msg-label owl';
                labelDiv.innerHTML = '<i class="fas fa-crow" style="font-size:9px"></i> OWL';

                wrapper.appendChild(labelDiv);
                wrapper.appendChild(bubbleDiv);
                container.appendChild(wrapper);
                container.scrollTop = container.scrollHeight;
                return;
            }

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function copyCode(btn) {
            const pre = btn.closest('.code-block-wrapper').querySelector('pre code');
            if (!pre) return;
            try {
                await navigator.clipboard.writeText(pre.innerText);
                btn.classList.add('copied');
                btn.innerHTML = '<i class="fas fa-check" style="font-size:10px;color:var(--green)"></i> Copied!';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<i class="far fa-copy" style="font-size:10px"></i> Copy';
                }, 2000);
            } catch (e) { console.error(e); }
        }

        // ── HYDRATE MESSAGES ─────────────────────────────
        async function hydrateExistingMessages(sessionId) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            try {
                const res = await fetch(`/api/chat/${sessionId}/messages`);
                const messages = await res.json();
                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="fas fa-crow"></i></div>
                            <span class="empty-state-text">Session initialized — Start a conversation</span>
                        </div>
                    `;
                    return;
                }
                messages.forEach(m => appendMessageBubble(m.role, m.content));
                container.scrollTop = container.scrollHeight;
            } catch (e) { console.error('[HYDRATE]', e); }
        }

        // ── SESSION MANAGEMENT ───────────────────────────
        async function createNewSession() {
            try {
                const res  = await fetch('/api/chat/new', { method: 'POST' });
                const data = await res.json();
                window.location.href = `/chat/${data.session_id}`;
            } catch (e) { console.error('[NEW-SESSION]', e); }
        }

        function toggleActionDropdown(event, chatId) {
            event.stopPropagation();
            document.querySelectorAll('[id^="dropdown-"]').forEach(d => {
                if (d.id !== `dropdown-${chatId}`) d.classList.add('hidden');
            });
            document.getElementById(`dropdown-${chatId}`).classList.toggle('hidden');
        }

        function openRenameModal(event, el) {
            event.stopPropagation();
            currentEditingChatId = el.getAttribute('data-id');
            originalChatTitle    = el.getAttribute('data-title').trim();

            const input = document.getElementById('modal-title-input');
            input.value = originalChatTitle;
            document.getElementById('modal-save-btn').disabled = true;

            document.getElementById('gemini-modal-backdrop').classList.add('open');
            input.focus();
            input.select();
        }

        function closeRenameModal() {
            document.getElementById('gemini-modal-backdrop').classList.remove('open');
            currentEditingChatId = null;
            originalChatTitle    = "";
        }

        async function submitRenamePipeline() {
            const newTitle = document.getElementById('modal-title-input').value.trim();
            if (!newTitle || newTitle === originalChatTitle || !currentEditingChatId) return;

            try {
                const res = await fetch(`/api/chat/${currentEditingChatId}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });
                if (!res.ok) throw new Error();

                const titleSpan = document.getElementById(`session-text-${currentEditingChatId}`);
                if (titleSpan) titleSpan.textContent = newTitle;

                const actionBtn = document.querySelector(`button[data-id="${currentEditingChatId}"]`);
                if (actionBtn) actionBtn.setAttribute('data-title', newTitle);

                closeRenameModal();
            } catch (e) { console.error('[RENAME]', e); }
        }

        async function triggerDeletePipeline(event, chatId) {
            event.stopPropagation();
            if (!confirm('Delete this session?')) return;
            try {
                const res = await fetch(`/api/chat/${chatId}/delete`, { method: 'POST' });
                if (!res.ok) throw new Error();
                document.getElementById(`session-item-${chatId}`).remove();
                if (activeSessionId == chatId) window.location.href = '/';
            } catch (e) { console.error('[DELETE]', e); }
        }

        // CSS spin keyframe injection
        const styleEl = document.createElement('style');
        styleEl.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(styleEl);
    </script>
</body>
</html>
