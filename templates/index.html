<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Studio Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #89b4fa;
        }
        .hljs {
            background: #181825 !important;
            color: #cdd6f4 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body class="bg-[#11111b] text-[#cdd6f4] font-sans antialiased h-screen flex overflow-hidden select-none">

    <aside class="w-80 bg-[#1e1e2e] border-r border-[#313244] flex flex-col h-full shrink-0">
        <div class="p-4 border-b border-[#313244]">
            <button onclick="createNewSession()" class="w-full bg-[#89b4fa] hover:bg-[#b4befe] text-[#11111b] font-semibold py-2.5 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg">
                <i class="fas fa-plus"></i> New Chat Session
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto p-2 space-y-1" id="sessions-container">
            {% for chat in recent_chats %}
            <div id="session-item-{{ chat.id }}" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 transition-all duration-200 {% if chat.id == active_session_id %}bg-[#313244] text-[#89b4fa] shadow-sm{% else %}hover:bg-[#181825]/60 text-[#a6adc8]{% endif %}">
                <a href="/chat/{{ chat.id }}" class="flex-1 truncate font-medium text-sm pr-8 flex items-center gap-2.5">
                    <i class="fas fa-comment-alt opacity-60 text-xs"></i>
                    <span id="session-text-{{ chat.id }}">{{ chat.title or 'Untitled Operational Pipeline' }}</span>
                </a>
                
                <div class="absolute right-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center">
                    <button onclick="toggleActionDropdown(event, {{ chat.id }})" class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-[#45475a] text-[#a6adc8] hover:text-[#cdd6f4] transition">
                        <i class="fas fa-ellipsis-v text-xs"></i>
                    </button>
                    
                    <div id="dropdown-{{ chat.id }}" class="hidden absolute right-0 top-8 bg-[#181825] border border-[#313244] rounded-xl shadow-2xl py-1.5 w-36 z-50 transform origin-top-right transition-all">
                        <button data-id="{{ chat.id }}" data-title="{{ chat.title or '' }}" onclick="openRenameModal(event, this)" class="w-full text-left px-4 py-2 text-xs font-medium text-[#cdd6f4] hover:bg-[#313244] flex items-center gap-2 transition">
                            <i class="fas fa-pen text-[#f9e2af]"></i> Rename
                        </button>
                        <button onclick="triggerDeletePipeline(event, {{ chat.id }})" class="w-full text-left px-4 py-2 text-xs font-medium text-[#f38ba8] hover:bg-[#313244]/50 flex items-center gap-2 transition">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </nav>
        
        <div class="p-4 bg-[#181825] border-t border-[#313244] text-xs text-[#6c7086] flex items-center justify-between">
            <span>Node Status: <span class="text-[#a6e3a1]">PROD CORE</span></span>
            <span>OWL v2.0</span>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-[#11111b] relative">
        <header class="h-16 border-b border-[#313244] bg-[#1e1e2e] flex items-center justify-between px-6 shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-[#a6e3a1] animate-pulse"></div>
                <h1 class="font-semibold text-sm uppercase tracking-wider text-[#cdd6f4]">
                    Pipeline Terminal Workspace {% if active_session_id %}[ID: {{ active_session_id }}]{% endif %}
                </h1>
            </div>
        </header>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-[#11111b]"></div>

        <footer class="p-4 bg-[#1e1e2e] border-t border-[#313244]">
            <form id="generation-form" class="max-w-4xl mx-auto space-y-3">
                <div class="flex items-center gap-3 bg-[#11111b] border border-[#313244] rounded-xl p-2.5 focus-within:border-[#89b4fa] transition shadow-inner">
                    <textarea id="prompt-input" required rows="1" placeholder="Enter structural generation rules or algorithmic prompts..." class="flex-1 bg-transparent border-0 outline-none focus:ring-0 text-sm text-[#cdd6f4] placeholder-[#6c7086] resize-none h-10 py-2.5 px-2"></textarea>
                    <button type="submit" id="submit-btn" class="bg-[#89b4fa] hover:bg-[#b4befe] text-[#11111b] w-10 h-10 rounded-lg flex items-center justify-center transition duration-200 shrink-0 shadow">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </form>
        </footer>
    </main>

    <div id="gemini-modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-all duration-200">
        <div class="bg-[#1e1e2e] border border-[#313244] w-full max-w-sm rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-200" id="gemini-modal-surface">
            <h2 class="text-lg font-semibold text-[#cdd6f4] mb-4">Rename this chat</h2>
            
            <div class="mb-6 relative">
                <input type="text" id="modal-title-input" maxlength="128" autocomplete="off" class="w-full bg-[#11111b] border-2 border-[#313244] focus:border-[#89b4fa] rounded-xl px-4 py-3 text-sm text-[#cdd6f4] placeholder-[#6c7086] outline-none transition-all duration-200">
            </div>
            
            <div class="flex items-center justify-end gap-3">
                <button onclick="closeRenameModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-[#a6adc8] hover:bg-[#313244] hover:text-[#cdd6f4] transition duration-150">
                    Cancel
                </button>
                <button id="modal-save-btn" onclick="submitRenamePipeline()" disabled class="px-5 py-2 rounded-xl text-sm font-medium bg-[#89b4fa] text-[#11111b] disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[#b4befe] transition duration-150 shadow-md">
                    Rename
                </button>
            </div>
        </div>
    </div>

    <script>
        const activeSessionId = "{{ active_session_id or '' }}";
        let currentEditingChatId = null;
        let originalChatTitle = "";

        marked.setOptions({
            highlight: (code, lang) => hljs.highlight(code, { language: hljs.getLanguage(lang) ? lang : 'plaintext' }).value,
            langPrefix: 'hljs language-'
        });

        document.addEventListener("DOMContentLoaded", () => {
            if (activeSessionId) hydrateExistingMessages(activeSessionId);
            
            document.addEventListener('click', () => {
                document.querySelectorAll('[id^="dropdown-"]').forEach(d => d.classList.add('hidden'));
            });

            document.getElementById('modal-title-input').addEventListener('input', (e) => {
                const val = e.target.value.trim();
                const saveBtn = document.getElementById('modal-save-btn');
                saveBtn.disabled = (val === "" || val === originalChatTitle);
            });

            // ATTACHMENT PIPELINE: Inbound Core Form Submission Handler
            const generationForm = document.getElementById('generation-form');
            if (generationForm) {
                generationForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const promptInput = document.getElementById('prompt-input');
                    const submitBtn = document.getElementById('submit-btn');
                    const promptText = promptInput.value.trim();
                    
                    if (!promptText || !activeSessionId) return;
                    
                    // Optimistic UI updates
                    appendMessageBubble('user', promptText);
                    promptInput.value = '';
                    
                    // Lock control systems to block double execution spikes
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner animate-spin text-sm"></i>';
                    
                    try {
                        const response = await fetch(`/api/chat/${activeSessionId}/send`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: promptText })
                        });
                        
                        if (!response.ok) throw new Error("Inbound payload rejection from runtime backend.");
                        
                        const data = await response.json();
                        // Support standard multi-model DB-stored log patterns
                        const assistantReply = data.response || data.content || "Empty tracking trace generated.";
                        
                        appendMessageBubble('assistant', assistantReply);
                        
                        const container = document.getElementById("chat-messages");
                        container.scrollTop = container.scrollHeight;
                    } catch (err) {
                        console.error("[FORM-SUBMISSION-EXCEPTION]", err);
                        appendMessageBubble('assistant', "Structural Failure: System endpoint isolated or failed to resolve model matrix.");
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane text-sm"></i>';
                    }
                });
            }

            // Keyboard optimization layer for textarea execution workflows
            const promptArea = document.getElementById('prompt-input');
            if (promptArea) {
                promptArea.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        generationForm.requestSubmit();
                    }
                });
            }
        });

        function toggleActionDropdown(event, chatId) {
            event.stopPropagation();
            document.querySelectorAll('[id^="dropdown-"]').forEach(d => {
                if(d.id !== `dropdown-${chatId}`) d.classList.add('hidden');
            });
            const targetDropdown = document.getElementById(`dropdown-${chatId}`);
            targetDropdown.classList.toggle('hidden');
        }

        function openRenameModal(event, element) {
            event.stopPropagation();
            currentEditingChatId = element.getAttribute('data-id');
            originalChatTitle = element.getAttribute('data-title').trim();
            
            const backdrop = document.getElementById('gemini-modal-backdrop');
            const input = document.getElementById('modal-title-input');
            const saveBtn = document.getElementById('modal-save-btn');
            
            input.value = originalChatTitle;
            saveBtn.disabled = true;
            
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
            input.focus();
            input.select();
        }

        function closeRenameModal() {
            const backdrop = document.getElementById('gemini-modal-backdrop');
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
            currentEditingChatId = null;
            originalChatTitle = "";
        }

        async function submitRenamePipeline() {
            const input = document.getElementById('modal-title-input');
            const newTitle = input.value.trim();
            if (!newTitle || newTitle === originalChatTitle || !currentEditingChatId) return;

            try {
                const response = await fetch(`/api/chat/${currentEditingChatId}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });

                if (!response.ok) throw new Error("Backend infrastructure validation failed.");
                
                const titleSpan = document.getElementById(`session-text-${currentEditingChatId}`);
                if (titleSpan) {
                    titleSpan.textContent = newTitle;
                    const actionBtn = document.querySelector(`button[data-id="${currentEditingChatId}"]`);
                    if (actionBtn) actionBtn.setAttribute('data-title', newTitle);
                }
                
                closeRenameModal();
            } catch (err) {
                console.error("[RENAME-EXCEPTION]", err);
            }
        }

        async function triggerDeletePipeline(event, chatId) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to terminate this operational pipeline session context?")) return;

            try {
                const response = await fetch(`/api/chat/${chatId}/delete`, { method: 'POST' });
                if (!response.ok) throw new Error("Purge rejected by storage node.");

                document.getElementById(`session-item-${chatId}`).remove();
                if (activeSessionId == chatId) window.location.href = '/';
            } catch (err) {
                console.error("[DELETE-EXCEPTION]", err);
            }
        }

        async function createNewSession() {
            try {
                const response = await fetch('/api/chat/new', { method: 'POST' });
                const data = await response.json();
                window.location.href = `/chat/${data.session_id}`;
            } catch (err) {
                console.error("[CREATION-FAILURE]", err);
            }
        }

        async function hydrateExistingMessages(sessionId) {
            const container = document.getElementById("chat-messages");
            container.innerHTML = '';
            try {
                const response = await fetch(`/api/chat/${sessionId}/messages`);
                const messages = await response.json();
                if (messages.length === 0) {
                    container.innerHTML = `<div class="text-center text-xs text-[#6c7086] py-12">Active session context initialized.</div>`;
                    return;
                }
                messages.forEach(msg => appendMessageBubble(msg.role, msg.content));
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("[HYDRATION-FAILURE]", err);
            }
        }

        function appendMessageBubble(role, content) {
            const container = document.getElementById("chat-messages");
            const wrapper = document.createElement("div");
            wrapper.className = `flex flex-col space-y-1 w-full max-w-3xl ${role === 'user' ? 'ml-auto items-end' : 'mr-auto items-start'}`;
            
            if (role === 'user') {
                wrapper.innerHTML = `<div class="bg-[#313244] text-[#cdd6f4] rounded-2xl rounded-tr-none py-3 px-4 shadow text-sm">${content}</div>`;
            } else {
                wrapper.innerHTML = `<div class="bg-[#181825] text-[#cdd6f4] border border-[#313244] rounded-2xl rounded-tl-none py-3 px-4 shadow text-sm w-full markdown-content">${marked.parse(content)}</div>`;
                
                // DECORATOR PIPELINE: Intercepting standard HTML block layouts for Gemini alignment
                wrapper.querySelectorAll('pre').forEach(preEl => {
                    const codeEl = preEl.querySelector('code');
                    if (!codeEl) return;
                    
                    hljs.highlightElement(codeEl);
                    
                    let detectedLang = 'Text';
                    const classTokens = codeEl.className.split(' ');
                    for (const token of classTokens) {
                        if (token.startsWith('language-')) {
                            detectedLang = token.replace('language-', '');
                            break;
                        }
                    }
                    
                    const normalizedLang = detectedLang.charAt(0).toUpperCase() + detectedLang.slice(1);
                    
                    // Constructing Premium Header Node matching image_d6c588.png
                    const headerNode = document.createElement('div');
                    headerNode.className = 'flex items-center justify-between bg-[#11111b] border-b border-[#313244] px-4 py-2 rounded-t-xl text-xs font-mono text-[#a6adc8] select-none';
                    headerNode.innerHTML = `
                        <span class="font-semibold tracking-wide text-[#94e2d5]">${normalizedLang}</span>
                        <div class="flex items-center gap-4">
                            <button type="button" onclick="executeCodeSnippetCopy(this)" class="hover:text-[#89b4fa] text-[#a6adc8] transition-all relative group flex items-center justify-center p-1">
                                <i class="far fa-copy text-sm"></i>
                                <span class="absolute bottom-full mb-2 bg-[#11111b] text-[#cdd6f4] border border-[#313244] text-[10px] px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-all duration-150 whitespace-nowrap pointer-events-none shadow-2xl">Copy code</span>
                            </button>
                        </div>
                    `;
                    
                    preEl.className = 'bg-[#181825] overflow-x-auto p-4 text-sm font-mono tracking-tight leading-relaxed';
                    preEl.style.margin = '0';
                    preEl.style.borderRadius = '0 0 12px 12px';
                    
                    const isolatedBlockContainer = document.createElement('div');
                    isolatedBlockContainer.className = 'my-4 rounded-xl overflow-hidden border border-[#313244] shadow-xl transition-all';
                    
                    preEl.parentNode.insertBefore(isolatedBlockContainer, preEl);
                    isolatedBlockContainer.appendChild(headerNode);
                    isolatedBlockContainer.appendChild(preEl);
                });
            }
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        async function executeCodeSnippetCopy(buttonElement) {
            const scopeWrapper = buttonElement.closest('.my-4');
            const targetCodeNode = scopeWrapper.querySelector('pre code');
            if (!targetCodeNode) return;
            
            const payloadString = targetCodeNode.innerText;
            
            try {
                await navigator.clipboard.writeText(payloadString);
                const internalIcon = buttonElement.querySelector('i');
                const tooltipSpan = buttonElement.querySelector('span');
                
                internalIcon.className = 'fas fa-check text-[#a6e3a1]';
                if(tooltipSpan) tooltipSpan.textContent = 'Copied!';
                
                setTimeout(() => {
                    internalIcon.className = 'far fa-copy text-sm';
                    if(tooltipSpan) tooltipSpan.textContent = 'Copy code';
                }, 2000);
            } catch (runtimeError) {
                console.error("[CLIPBOARD-API-FAILURE]", runtimeError);
            }
        }
    </script>
</body>
</html>
