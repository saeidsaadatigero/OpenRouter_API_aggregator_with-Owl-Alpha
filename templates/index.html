<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL Studio — Intelligence Terminal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' x='50%' text-anchor='middle'>🦉</text></svg>">
    <meta name="theme-color" content="#6366f1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <style>
        :root {
            --bg-base:      #0d0d14;
            --bg-surface:   #13131f;
            --bg-elevated:  #1a1a2a;
            --bg-hover:     #1f1f32;
            --border:       #252538;
            --border-light: #2e2e4a;
            --accent:       #7c6af7;
            --accent-soft:  #9d8fff;
            --accent-glow:  rgba(124,106,247,0.18);
            --accent-glow2: rgba(124,106,247,0.08);
            --green:        #3dd68c;
            --green-glow:   rgba(61,214,140,0.15);
            --red:          #f0567a;
            --yellow:       #f5c542;
            --cyan:         #56d4f0;
            --text-primary: #e8e8f0;
            --text-muted:   #7070a0;
            --text-dim:     #404060;
            --font-ui:      'Syne', sans-serif;
            --font-mono:    'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-base:      #f8f9fa;
            --bg-surface:   #ffffff;
            --bg-elevated:  #f1f3f5;
            --bg-hover:     #e9ecef;
            --border:       #dee2e6;
            --border-light: #ced4da;
            --accent:       #7c6af7;
            --accent-soft:  #6358e0;
            --accent-glow:  rgba(124,106,247,0.12);
            --accent-glow2: rgba(124,106,247,0.05);
            --green:        #28a745;
            --green-glow:   rgba(40,167,69,0.15);
            --red:          #dc3545;
            --yellow:       #ffc107;
            --cyan:         #17a2b8;
            --text-primary: #212529;
            --text-muted:   #6c757d;
            --text-dim:     #adb5bd;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ── SIDEBAR ─────────────────────────────── */
        aside {
            width: 272px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
            transition: background 0.3s ease;
        }

        aside::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent, var(--accent) 40%, var(--cyan) 70%, transparent);
            opacity: 0.25;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            color: #fff;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.03em;
            padding: 11px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(124,106,247,0.3);
            position: relative;
            overflow: hidden;
        }

        .new-chat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(124,106,247,0.4); }
        .new-chat-btn:hover::before { opacity: 1; }
        .new-chat-btn:active { transform: translateY(0); }

        .sessions-nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px;
        }

        .session-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 9px;
            padding: 9px 12px;
            margin-bottom: 2px;
            transition: all 0.18s ease;
            cursor: pointer;
        }

        .session-item:not(.active):hover { background: var(--bg-hover); }

        .session-item.active {
            background: var(--accent-glow);
            border: 1px solid rgba(124,106,247,0.3);
        }

        .session-item.active .session-title { color: var(--accent-soft); }

        .session-link {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            overflow: hidden;
            padding-right: 28px;
        }

        .session-item.active .session-link { color: var(--accent-soft); }
        .session-link:hover { color: var(--text-primary); }

        .session-icon {
            width: 22px; height: 22px;
            border-radius: 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 9px;
            color: var(--text-dim);
            transition: all 0.15s;
        }

        .session-item.active .session-icon {
            background: var(--accent-glow);
            border-color: rgba(124,106,247,0.4);
            color: var(--accent-soft);
        }

        .session-actions {
            position: absolute;
            right: 8px;
            opacity: 0;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
        }

        .session-item:hover .session-actions { opacity: 1; }

        .action-dot-btn {
            width: 24px; height: 24px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
            transition: all 0.15s;
        }

        .action-dot-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

        .dropdown-menu {
            position: absolute;
            right: 0; top: 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            padding: 6px;
            width: 140px;
            z-index: 100;
        }

        .dropdown-item {
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            font-family: var(--font-ui);
            font-weight: 500;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--bg-hover); }
        .dropdown-item.rename { color: var(--text-primary); }
        .dropdown-item.delete { color: var(--red); }

        .sidebar-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s ease;
        }

        .status-badge {
            display: flex; align-items: center; gap: 7px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse-green 2.5s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
            50% { opacity: 0.6; box-shadow: 0 0 16px var(--green); }
        }

        /* ── MAIN ────────────────────────────────── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-base);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        main::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.18;
            pointer-events: none;
        }

        /* ── HEADER ──────────────────────────────── */
        header {
            height: 58px;
            border-bottom: 1px solid var(--border);
            background: rgba(13,13,20,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
            position: relative;
            transition: background 0.3s ease;
        }

        [data-theme="light"] header {
            background: rgba(255,255,255,0.9);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 2px 12px rgba(124,106,247,0.4);
        }

        .header-title {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 15px; /* از 13px به 15px */
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-primary);
        }


        .header-session-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--cyan);
            background: rgba(86,212,240,0.08);
            border: 1px solid rgba(86,212,240,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.05em;
        }

        .theme-toggle {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--bg-elevated);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ── MESSAGES ────────────────────────────── */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 780px;
            animation: msg-in 0.3s cubic-bezier(0.2, 0, 0, 1) both;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.user { margin-left: auto; align-items: flex-end; }
        .msg-wrapper.assistant { margin-right: auto; align-items: flex-start; }

        .msg-bubble-user {
            background: linear-gradient(135deg, var(--accent) 0%, #5b4fcf 100%);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            padding: 12px 18px;
            font-size: 13.5px;
            line-height: 1.6;
            box-shadow: 0 4px 24px rgba(124,106,247,0.25);
            max-width: 580px;
            word-break: break-word;
            user-select: text;
        }

        .msg-bubble-assistant {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 4px 16px 16px 16px;
            padding: 16px 20px;
            font-size: 13.5px;
            line-height: 1.7;
            width: 100%;
            user-select: text;
            position: relative;
            transition: background 0.3s ease;
        }

        .msg-bubble-assistant::before {
            content: '';
            position: absolute;
            left: -1px; top: 0; bottom: 0;
            width: 2px;
            border-radius: 0 0 0 4px;
            background: linear-gradient(180deg, var(--accent), var(--cyan));
            opacity: 0.6;
        }

        .msg-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-label.owl { color: var(--accent-soft); }
        .msg-label.you { color: var(--text-dim); }

        .msg-timestamp {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .msg-wrapper:hover .msg-timestamp {
            opacity: 1;
        }

        .msg-wrapper.user .msg-timestamp {
            text-align: right;
        }

        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .msg-wrapper:hover .msg-actions {
            opacity: 1;
        }

        .msg-wrapper.user .msg-actions {
            justify-content: flex-end;
        }

        .msg-action-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .msg-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .msg-action-btn.delete:hover {
            color: var(--red);
            border-color: var(--red);
        }

        .msg-bubble-assistant h1, .msg-bubble-assistant h2, .msg-bubble-assistant h3 {
            font-family: var(--font-ui);
            font-weight: 700;
            margin: 16px 0 8px;
            color: var(--text-primary);
        }

        .msg-bubble-assistant h1 { font-size: 18px; }
        .msg-bubble-assistant h2 { font-size: 15px; }
        .msg-bubble-assistant h3 { font-size: 13px; color: var(--accent-soft); }

        .msg-bubble-assistant p { margin: 0 0 10px; color: var(--text-primary); }
        .msg-bubble-assistant p:last-child { margin-bottom: 0; }

        .msg-bubble-assistant ul, .msg-bubble-assistant ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .msg-bubble-assistant li { margin: 4px 0; color: var(--text-primary); }

        .msg-bubble-assistant code:not(pre code) {
            font-family: var(--font-mono);
            font-size: 12px;
            background: rgba(124,106,247,0.12);
            border: 1px solid rgba(124,106,247,0.2);
            color: var(--accent-soft);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .msg-bubble-assistant a { color: var(--cyan); text-decoration: underline; }

        .hljs { background: #0d0d18 !important; color: #cdd6f4 !important; padding: 0 !important; }

        [data-theme="light"] .hljs { background: #f8f9fa !important; color: #212529 !important; }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0d18;
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        [data-theme="light"] .code-block-header {
            background: #f8f9fa;
        }

        .code-lang-tag {
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .copy-btn {
            display: flex; align-items: center; gap: 6px;
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.05em;
        }

        .copy-btn:hover { background: var(--accent-glow2); border-color: var(--accent); color: var(--accent-soft); }
        .copy-btn.copied { color: var(--green); border-color: var(--green); }

        .code-block-pre {
            background: #0d0d18 !important;
            overflow-x: auto;
            padding: 16px !important;
            margin: 0 !important;
            border-radius: 0 !important;
            font-family: var(--font-mono) !important;
            font-size: 12.5px !important;
            line-height: 1.65 !important;
        }

        [data-theme="light"] .code-block-pre {
            background: #f8f9fa !important;
        }

        /* ── TYPING INDICATOR ────────────────────── */
        .typing-indicator-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 780px;
            margin-right: auto;
            align-items: flex-start;
            animation: msg-in 0.3s ease both;
        }

        .typing-bubble {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            min-width: 180px;
        }

        .typing-bubble::before {
            content: '';
            position: absolute;
            left: -1px; top: 0; bottom: 0;
            width: 2px;
            border-radius: 0 0 0 4px;
            background: linear-gradient(180deg, var(--accent), var(--cyan));
            opacity: 0.6;
        }

        .typing-dots {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .typing-text {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .typing-bars {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .typing-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: bar-wave 1.2s infinite ease-in-out;
        }

        .typing-bar:nth-child(1) { animation-delay: 0s;    height: 8px; }
        .typing-bar:nth-child(2) { animation-delay: 0.15s; height: 14px; }
        .typing-bar:nth-child(3) { animation-delay: 0.3s;  height: 20px; }
        .typing-bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
        .typing-bar:nth-child(5) { animation-delay: 0.6s;  height: 8px; }

        @keyframes bar-wave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
            50%       { transform: scaleY(1);   opacity: 1; }
        }

        /* ── EMPTY STATE ─────────────────────────── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
        }

        .empty-state-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: var(--text-dim);
        }

        .empty-state-text {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        /* ── LOADING SKELETON ────────────────────── */
        .skeleton-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 32px 48px;
        }

        .skeleton-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: skeleton-pulse 1.5s infinite;
        }

        .skeleton-item.user { align-items: flex-end; }
        .skeleton-item.assistant { align-items: flex-start; }

        .skeleton-bubble {
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-hover) 50%, var(--bg-elevated) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
        }

        .skeleton-bubble.user {
            width: 200px;
            background: linear-gradient(90deg, rgba(124,106,247,0.2) 25%, rgba(124,106,247,0.3) 50%, rgba(124,106,247,0.2) 75%);
            background-size: 200% 100%;
        }

        .skeleton-bubble.assistant { width: 400px; }
        .skeleton-bubble.assistant.small { width: 250px; height: 80px; }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── FOOTER / INPUT ──────────────────────── */
        footer {
            padding: 16px 48px 20px;
            background: rgba(13,13,20,0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            z-index: 10;
            position: relative;
            transition: background 0.3s ease;
        }

        [data-theme="light"] footer {
            background: rgba(255,255,255,0.95);
        }

        .input-form { max-width: 780px; margin: 0 auto; }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 10px 10px 10px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(124,106,247,0.5);
            box-shadow: 0 0 0 3px var(--accent-glow2), 0 4px 24px rgba(0,0,0,0.2);
        }

        #prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font-ui);
            font-size: 13.5px;
            color: var(--text-primary);
            resize: none;
            min-height: 20px;
            max-height: 160px;
            line-height: 1.5;
            padding: 4px 0;
        }

        #prompt-input::placeholder { color: var(--text-dim); }

        #submit-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 2px 12px rgba(124,106,247,0.35);
        }

        #submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,247,0.5); }
        #submit-btn:active:not(:disabled) { transform: translateY(0); }
        #submit-btn:disabled { opacity: 0.7; cursor: default; }

        .input-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 8px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .char-counter {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .char-counter.warning { color: var(--yellow); }
        .char-counter.danger { color: var(--red); }

        .auto-scroll-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .auto-scroll-toggle input { display: none; }

        .toggle-slider {
            width: 28px;
            height: 16px;
            background: var(--border);
            border-radius: 8px;
            position: relative;
            transition: background 0.2s;
        }

        .toggle-slider::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--text-muted);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.2s;
        }

        .auto-scroll-toggle input:checked + .toggle-slider { background: var(--accent); }
        .auto-scroll-toggle input:checked + .toggle-slider::after { left: 14px; background: #fff; }

        .toggle-label { font-size: 10px; color: var(--text-dim); }

        /* ── SCROLL TO BOTTOM ───────────────────── */
        .scroll-bottom-btn {
            position: fixed;
            bottom: 100px;
            right: 48px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.2s;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            z-index: 50;
        }

        .scroll-bottom-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .scroll-bottom-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── MODAL ───────────────────────────────── */
        #gemini-modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #gemini-modal-backdrop.open { display: flex; }

        .modal-surface {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: modal-in 0.2s cubic-bezier(0.2, 0, 0, 1) both;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        .modal-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow2); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        .modal-btn-cancel {
            padding: 9px 18px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .modal-btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }

        .modal-btn-save {
            padding: 9px 22px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 12px rgba(124,106,247,0.3);
        }

        .modal-btn-save:disabled { opacity: 0.4; cursor: default; }
        .modal-btn-save:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,247,0.45); }

        /* ── EXPORT MENU ─────────────────────────── */
        .export-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            padding: 6px;
            min-width: 160px;
            z-index: 100;
            display: none;
        }

        .export-menu.open { display: block; }

        .export-item {
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            font-family: var(--font-ui);
            font-weight: 500;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            transition: background 0.15s;
        }

        .export-item:hover { background: var(--bg-hover); }

        /* ── EDIT MESSAGE TEXTAREA ───────────────── */
        .edit-textarea {
            width: 100%;
            min-width: 200px;
            max-width: 580px;
            background: var(--bg-surface);
            border: 1.5px solid var(--accent);
            border-radius: 16px 16px 4px 16px;
            padding: 12px 18px;
            font-family: var(--font-ui);
            font-size: 13.5px;
            color: var(--text-primary);
            outline: none;
            resize: vertical;
            min-height: 20px;
            max-height: 300px;
            line-height: 1.6;
            margin-top: 8px;
            overflow-y: auto;
        }

        .edit-textarea:focus {
            box-shadow: 0 0 0 3px var(--accent-glow2);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .edit-save-btn {
            padding: 6px 14px;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .edit-save-btn:hover { background: #5b4fcf; }

        .edit-cancel-btn {
            padding: 6px 14px;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .edit-cancel-btn:hover { background: var(--bg-hover); }

        /* ── SETTINGS MODAL ───────────────────────── */
        #settings-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #settings-modal-backdrop.open { display: flex; }

        .settings-modal-surface {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 700px;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: modal-in 0.2s cubic-bezier(0.2, 0, 0, 1) both;
            display: flex;
            flex-direction: column;
        }

        .settings-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .settings-modal-title {
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .settings-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .settings-close-btn:hover {
            background: var(--bg-hover);
            color: var(--red);
        }

        .settings-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .settings-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .settings-tab {
            padding: 8px 16px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .settings-tab:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .settings-tab.active {
            background: var(--accent);
            color: #fff;
        }

        .settings-tab-content {
            display: none;
        }

        .settings-tab-content.active {
            display: block;
        }

        .settings-form-group {
            margin-bottom: 16px;
        }

        .settings-label {
            display: block;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .settings-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .settings-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow2);
        }

        .settings-textarea {
            width: 100%;
            min-height: 300px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-primary);
            outline: none;
            resize: vertical;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .settings-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow2);
        }

        .settings-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--text-primary);
        }

        .settings-checkbox-label input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .settings-btn {
            padding: 10px 20px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #5b4fcf);
            border: none;
            box-shadow: 0 2px 12px rgba(124,106,247,0.3);
        }

        .settings-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(124,106,247,0.45);
        }

        .settings-btn-secondary {
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
        }

        .settings-btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .settings-btn-danger {
            color: var(--red);
            background: transparent;
            border: 1px solid var(--red);
        }

        .settings-btn-danger:hover {
            background: rgba(240, 86, 122, 0.1);
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .settings-list-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            transition: all 0.15s;
        }

        .settings-list-item:hover {
            border-color: var(--accent);
        }

        .settings-list-item.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .settings-list-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .settings-list-item-title {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .settings-list-item-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            text-transform: uppercase;
        }

        .settings-list-item-preview {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 12px;
        }

        .settings-list-item-actions {
            display: flex;
            gap: 8px;
        }

        .settings-list-item-btn {
            padding: 6px 12px;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .settings-list-item-btn.edit {
            color: var(--text-primary);
            background: var(--bg-hover);
            border: 1px solid var(--border-light);
        }

        .settings-list-item-btn.edit:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .settings-list-item-btn.activate {
            color: var(--green);
            background: transparent;
            border: 1px solid var(--green);
        }

        .settings-list-item-btn.activate:hover {
            background: rgba(61, 214, 140, 0.1);
        }

        .settings-list-item-btn.delete {
            color: var(--red);
            background: transparent;
            border: 1px solid var(--red);
        }

        .settings-list-item-btn.delete:hover {
            background: rgba(240, 86, 122, 0.1);
        }

        /* ── MOBILE SIDEBAR ──────────────────────── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 199;
        }

        .sidebar-overlay.open {
            display: block;
        }

        /* Hamburger Button */
        .hamburger-btn {
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--bg-elevated);
            color: var(--text-muted);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* ── SHOW MORE BUTTON ────────────────────── */
        .show-more-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--accent-soft);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            transition: all 0.15s;
        }

        .show-more-btn:hover {
            background: var(--accent-glow2);
            border-color: var(--accent);
        }

        .msg-bubble-user.collapsed {
            max-height: 120px;
            overflow: hidden;
            position: relative;
        }

        .msg-bubble-user.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, rgba(124,106,247,0.8));
            border-radius: 0 0 4px 16px;
        }

        /* ── RESPONSIVE ───────────────────────────── */
        @media (max-width: 1024px) {
            aside {
                width: 200px;
            }
            
            .header-title {
                font-size: 13px;
            }
            
            .model-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
        }

        @media (max-width: 768px) {
            .hamburger-btn {
                display: flex;
            }
            
            aside {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            aside.open {
                transform: translateX(0);
            }
            
            main {
                width: 100%;
            }
            
            header {
                padding: 0 16px;
                height: 52px;
            }
            
            .header-title {
                font-size: 12px;
            }
            
            .header-session-id {
                display: none;
            }
            
            #chat-messages {
                padding: 16px;
                gap: 12px;
            }
            
            .msg-bubble-user,
            .msg-bubble-assistant {
                font-size: 13px;
                padding: 10px 14px;
            }
            
            .code-block-wrapper {
                margin: 8px 0;
            }
            
            .code-block-pre {
                padding: 12px !important;
                font-size: 11px !important;
                overflow-x: auto;
            }
            
            footer {
                padding: 12px 16px 16px;
            }
            
            #prompt-input {
                font-size: 14px;
                min-height: 44px;
            }
            
            #submit-btn {
                width: 44px;
                height: 44px;
            }
            
            .input-hint {
                font-size: 9px;
            }
            
            .modal-surface {
                margin: 16px;
                max-width: calc(100% - 32px);
            }
            
            .settings-modal-surface {
                margin: 0;
                max-width: 100%;
                height: 100%;
                border-radius: 0;
            }
            
            .sidebar-header {
                padding: 16px;
            }
            
            .new-chat-btn {
                padding: 10px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- ── SIDEBAR ─────────────────────────────── -->
     <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
    <aside>
        <div class="sidebar-header">
            <button onclick="createNewSession()" class="new-chat-btn">
                <i class="fas fa-plus" style="font-size:11px"></i>
                New Session
            </button>
        </div>

        <nav class="sessions-nav" id="sessions-container">
            {% for chat in recent_chats %}
            <div id="session-item-{{ chat.id }}"
                 class="session-item {% if chat.id == active_session_id %}active{% endif %}">
                <a href="/chat/{{ chat.id }}" class="session-link">
                    <div class="session-icon">
                        <i class="fas fa-terminal"></i>
                    </div>
                    <span id="session-text-{{ chat.id }}" class="session-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                        {{ chat.title or 'Untitled Session' }}
                    </span>
                </a>

                <div class="session-actions">
                    <button onclick="toggleActionDropdown(event, {{ chat.id }})" class="action-dot-btn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <div id="dropdown-{{ chat.id }}" class="dropdown-menu hidden">
                        <button data-id="{{ chat.id }}" data-title="{{ chat.title or '' }}"
                                onclick="openRenameModal(event, this)"
                                class="dropdown-item rename">
                            <i class="fas fa-pen" style="color:var(--yellow);font-size:10px"></i> Rename
                        </button>
                        <button onclick="triggerDeletePipeline(event, {{ chat.id }})"
                                class="dropdown-item delete">
                            <i class="fas fa-trash-alt" style="font-size:10px"></i> Delete
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </nav>

        <div class="sidebar-footer">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>ONLINE</span>
            </div>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">OWL v2.0</span>
        </div>
    </aside>

    <!-- ── MAIN ───────────────────────────────── -->
    <main>
        <header>
            <button class="hamburger-btn" onclick="toggleMobileSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-left">
                <span class="header-title" style="display:flex;align-items:center;gap:8px">
                <svg viewBox="0 0 100 100" style="width:28px;height:28px" xmlns="http://www.w3.org/2000/svg">
                    <text y=".9em" font-size="80" x="50%" text-anchor="middle">🦉</text>
                </svg>
                    Intelligence Terminal
                </span>

                {% if active_session_id %}
                <span class="header-session-id">SID:{{ active_session_id }}</span>
                {% endif %}
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <button class="theme-toggle" onclick="openSettingsModal()" title="System Instructions">
                    <i class="fas fa-cog"></i>
                </button>
                <div style="position:relative;">
                    <button class="theme-toggle" onclick="toggleExportMenu()" title="Export Chat">
                        <i class="fas fa-download"></i>
                    </button>
                    <div id="export-menu" class="export-menu">
                        <button class="export-item" onclick="exportChat('json')">
                            <i class="fas fa-file-code" style="color:var(--cyan)"></i> Export as JSON
                        </button>
                        <button class="export-item" onclick="exportChat('markdown')">
                            <i class="fas fa-file-alt" style="color:var(--green)"></i> Export as Markdown
                        </button>
                        <button class="export-item" onclick="exportChat('txt')">
                            <i class="fas fa-file" style="color:var(--yellow)"></i> Export as Text
                        </button>
                    </div>
                </div>
                <span class="model-badge">Owl-Alpha/ Chat</span>
            </div>
        </header>

        <div id="chat-messages">
            <!-- Loading Skeleton -->
            <div id="loading-skeleton" class="skeleton-wrapper">
                <div class="skeleton-item assistant">
                    <div class="skeleton-bubble assistant"></div>
                </div>
                <div class="skeleton-item user">
                    <div class="skeleton-bubble user"></div>
                </div>
                <div class="skeleton-item assistant">
                    <div class="skeleton-bubble assistant small"></div>
                </div>
            </div>
        </div>

        <!-- Scroll to Bottom Button -->
        <button id="scroll-bottom-btn" class="scroll-bottom-btn" onclick="scrollToBottom()">
            <i class="fas fa-chevron-down"></i>
        </button>

        <footer>
            <form id="generation-form" class="input-form">
                <div class="input-container">
                    <textarea id="prompt-input" rows="1"
                        placeholder="Ask anything or request code generation..."
                        required></textarea>
                    <button type="submit" id="submit-btn">
                        <i class="fas fa-paper-plane" style="font-size:12px"></i>
                    </button>
                </div>
                <p class="input-hint">
                    <span>Enter ↵ to send · Shift+Enter for new line</span>
                    <span class="char-counter" id="char-counter">0 / 150000</span>
                    <label class="auto-scroll-toggle">
                        <input type="checkbox" id="auto-scroll-toggle" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Auto-scroll</span>
                    </label>
                </p>
            </form>
        </footer>
    </main>

    <!-- ── RENAME MODAL ───────────────────────── -->
    <div id="gemini-modal-backdrop">
        <div class="modal-surface" id="gemini-modal-surface">
            <p class="modal-title">Rename session</p>
            <input type="text" id="modal-title-input" maxlength="128"
                   autocomplete="off" class="modal-input"
                   placeholder="Session title...">
            <div class="modal-actions">
                <button onclick="closeRenameModal()" class="modal-btn-cancel">Cancel</button>
                <button id="modal-save-btn" onclick="submitRenamePipeline()"
                        disabled class="modal-btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- ── SETTINGS MODAL ───────────────────────── -->
    <div id="settings-modal-backdrop">
        <div class="settings-modal-surface">
            <div class="settings-modal-header">
                <p class="settings-modal-title">⚙️ System Instructions</p>
                <button onclick="closeSettingsModal()" class="settings-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="settings-modal-body">
                <!-- Instruction Tabs -->
                <div class="settings-tabs">
                    <button class="settings-tab active" onclick="switchSettingsTab('current', this)">Current</button>
                    <button class="settings-tab" onclick="switchSettingsTab('manage', this)">Manage</button>
                </div>
                
                <!-- Current Instruction Tab -->
                <div id="settings-tab-current" class="settings-tab-content active">
                    <div class="settings-form-group">
                        <label class="settings-label">Title</label>
                        <input type="text" id="instruction-title" class="settings-input" placeholder="Instruction title...">
                    </div>
                    
                    <div class="settings-form-group">
                        <label class="settings-label">Instructions Content</label>
                        <textarea id="instruction-content" class="settings-textarea" placeholder="Enter your system instructions here..."></textarea>
                    </div>
                    
                    <div class="settings-form-group">
                        <label class="settings-checkbox-label">
                            <input type="checkbox" id="instruction-active" checked>
                            <span>Set as Active</span>
                        </label>
                    </div>
                    
                    <div class="settings-actions">
                        <button onclick="saveInstruction()" class="settings-btn settings-btn-primary">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <button onclick="resetToDefault()" class="settings-btn settings-btn-secondary">
                            <i class="fas fa-undo"></i> Reset to Default
                        </button>
                    </div>
                </div>
                
                <!-- Manage Instructions Tab -->
                <div id="settings-tab-manage" class="settings-tab-content">
                    <div class="settings-list" id="instructions-list">
                        <!-- Instructions will be loaded here -->
                    </div>
                    <div class="settings-actions">
                        <button onclick="createNewInstruction()" class="settings-btn settings-btn-primary">
                            <i class="fas fa-plus"></i> New Instruction
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const activeSessionId = "{{ active_session_id or '' }}";
        let currentEditingChatId = null;
        let originalChatTitle = "";
        let messageTimestamps = {};
        let autoScrollEnabled = true;
        let currentEditingInstructionId = null;
        let MAX_CHARS = 150000;
        let typingTimerInterval = null;
        let typingSeconds = 0;

        // ── Load Config ─────────────────────────────
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                MAX_CHARS = data.max_chars || 150000;
            } catch (e) {
                console.error('[LOAD-CONFIG]', e);
            }
        }

        // ── Theme Toggle ───────────────────────────────
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            const currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'light') {
                body.removeAttribute('data-theme');
                icon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').className = 'fas fa-sun';
        }

        // ── Export Menu ────────────────────────────────
        function toggleExportMenu() {
            document.getElementById('export-menu').classList.toggle('open');
        }

        // Close export menu on outside click
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('export-menu');
            const btn = e.target.closest('.theme-toggle');
            if (menu && !menu.contains(e.target) && !btn) {
                menu.classList.remove('open');
            }
        });

        // ── Export Chat ────────────────────────────────
        function exportChat(format) {
            const messages = document.getElementById('chat-messages');
            const msgWrappers = messages.querySelectorAll('.msg-wrapper');
            
            if (msgWrappers.length === 0) {
                alert('No messages to export!');
                return;
            }

            let content = '';

            if (format === 'json') {
                const data = [];
                msgWrappers.forEach(wrapper => {
                    const role = wrapper.classList.contains('user') ? 'user' : 'assistant';
                    const bubble = wrapper.querySelector('.msg-bubble-user, .msg-bubble-assistant');
                    const timeEl = wrapper.querySelector('.msg-timestamp');
                    data.push({
                        role: role,
                        content: bubble ? bubble.innerText : '',
                        timestamp: timeEl ? timeEl.getAttribute('data-time') : ''
                    });
                });
                content = JSON.stringify(data, null, 2);
            } else if (format === 'markdown') {
                content = `# OWL Studio Chat Export\n`;
                content += `Date: ${new Date().toLocaleString()}\n\n`;
                content += `---\n\n`;
                msgWrappers.forEach(wrapper => {
                    const role = wrapper.classList.contains('user') ? '**You**' : '**OWL**';
                    const bubble = wrapper.querySelector('.msg-bubble-user, .msg-bubble-assistant');
                    const timeEl = wrapper.querySelector('.msg-timestamp');
                    const time = timeEl ? timeEl.innerText : '';
                    content += `${role} _(${time})_\n\n`;
                    content += `${bubble ? bubble.innerText : ''}\n\n`;
                    content += `---\n\n`;
                });
            } else if (format === 'txt') {
                content = `OWL Studio Chat Export\n`;
                content += `Date: ${new Date().toLocaleString()}\n\n`;
                content += `========================\n\n`;
                msgWrappers.forEach(wrapper => {
                    const role = wrapper.classList.contains('user') ? 'You' : 'OWL';
                    const bubble = wrapper.querySelector('.msg-bubble-user, .msg-bubble-assistant');
                    const timeEl = wrapper.querySelector('.msg-timestamp');
                    const time = timeEl ? timeEl.innerText : '';
                    content += `[${time}] ${role}:\n`;
                    content += `${bubble ? bubble.innerText : ''}\n\n`;
                    content += `========================\n\n`;
                });
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `owl-chat-${Date.now()}.${format === 'json' ? 'json' : format === 'markdown' ? 'md' : 'txt'}`;
            a.click();
            URL.revokeObjectURL(url);
            
            document.getElementById('export-menu').classList.remove('open');
        }

        // ── Character Counter ──────────────────────────

        function updateCharCounter() {
            const textarea = document.getElementById('prompt-input');
            const counter = document.getElementById('char-counter');
            const length = textarea.value.length;
            
            counter.textContent = `${length} / ${MAX_CHARS}`;
            
            counter.classList.remove('warning', 'danger');
            if (length > MAX_CHARS * 0.9) {
                counter.classList.add('danger');
            } else if (length > MAX_CHARS * 0.7) {
                counter.classList.add('warning');
            }
        }

        // ── Auto-scroll Toggle ─────────────────────────
        document.getElementById('auto-scroll-toggle').addEventListener('change', (e) => {
            autoScrollEnabled = e.target.checked;
            localStorage.setItem('autoScroll', autoScrollEnabled);
        });

        // Load saved auto-scroll preference
        if (localStorage.getItem('autoScroll') === 'false') {
            document.getElementById('auto-scroll-toggle').checked = false;
            autoScrollEnabled = false;
        }

        // ── Scroll to Bottom ───────────────────────────
        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }

        // Show/hide scroll button based on scroll position
        document.getElementById('chat-messages').addEventListener('scroll', function() {
            const btn = document.getElementById('scroll-bottom-btn');
            const isNearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 100;
            
            if (isNearBottom) {
                btn.classList.remove('visible');
            } else {
                btn.classList.add('visible');
            }
        });

        // ── marked + hljs setup ──────────────────────────
        marked.setOptions({
            highlight: (code, lang) =>
                hljs.highlight(code, { language: hljs.getLanguage(lang) ? lang : 'plaintext' }).value,
            langPrefix: 'hljs language-'
        });

        // ── DOMContentLoaded ─────────────────────────────
        document.addEventListener("DOMContentLoaded", () => {
            // Load config from server
            loadConfig();
            
            // Restore draft from localStorage
            const savedDraft = localStorage.getItem('draft_prompt');
            if (savedDraft) {
                const promptArea = document.getElementById('prompt-input');
                promptArea.value = savedDraft;
                promptArea.style.height = 'auto';
                promptArea.style.height = Math.min(promptArea.scrollHeight, 160) + 'px';
                updateCharCounter();
            }

            // Hide loading skeleton after content loads
            setTimeout(() => {
                const skeleton = document.getElementById('loading-skeleton');
                if (skeleton) skeleton.remove();
                
                if (activeSessionId) {
                    hydrateExistingMessages(activeSessionId);
                } else {
                    showEmptyState();
                }
            }, 1500);

            document.addEventListener('click', () => {
                document.querySelectorAll('[id^="dropdown-"]').forEach(d => d.classList.add('hidden'));
            });

            document.getElementById('modal-title-input').addEventListener('input', (e) => {
                const val = e.target.value.trim();
                document.getElementById('modal-save-btn').disabled =
                    (val === "" || val === originalChatTitle);
            });

            // auto-resize textarea
            const promptArea = document.getElementById('prompt-input');
            promptArea.addEventListener('input', () => {
                promptArea.style.height = 'auto';
                promptArea.style.height = Math.min(promptArea.scrollHeight, 160) + 'px';
                updateCharCounter();
                // Save draft to localStorage
                localStorage.setItem('draft_prompt', promptArea.value);
            });

            // keyboard submit
            promptArea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('generation-form').requestSubmit();
                }
            });

            // form submit
            document.getElementById('generation-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const promptInput = document.getElementById('prompt-input');
                const submitBtn   = document.getElementById('submit-btn');
                const promptText  = promptInput.value.trim();

                if (!promptText || !activeSessionId) return;

                // Check character limit
                if (promptText.length > MAX_CHARS) {
                    alert(`Message too long! Maximum ${MAX_CHARS} characters allowed.`);
                    return;
                }

                appendMessageBubble('user', promptText);
                promptInput.value = '';
                promptInput.style.height = 'auto';
                updateCharCounter();
                // Clear draft after sending
                localStorage.removeItem('draft_prompt');

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner" style="animation:spin 0.8s linear infinite;font-size:12px"></i>';

                // show typing indicator
                const typingEl = showTypingIndicator();

                fetch(`/api/chat/${activeSessionId}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="font-size:12px"></i>';
                    if (data.status === 'processing' && data.message_id) {
                        pollMessageStatus(data.message_id, typingEl);
                    } else {
                        removeTypingIndicator(typingEl);
                        appendMessageBubble('assistant', data.response || data.content || 'No response.');
                    }
                })
                .catch(err => {
                    console.error('[SUBMIT-ERROR]', err);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="font-size:12px"></i>';
                    removeTypingIndicator(typingEl);
                    appendMessageBubble('assistant', '⚠️ **Connection error.** Please try again.');
                });
            });    
        });

        // ── Show Empty State ────────────────────────────
        function showEmptyState() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-crow"></i></div>
                    <span class="empty-state-text">Session initialized — Start a conversation</span>
                </div>
            `;
        }

        // ── Typing Timer ────────────────────────────
        function startTypingTimer() {
            typingSeconds = 0;
            const timerEl = document.getElementById('typing-timer');
            if (timerEl) timerEl.textContent = '0s';
            
            typingTimerInterval = setInterval(() => {
                typingSeconds++;
                const timerEl = document.getElementById('typing-timer');
                if (timerEl) {
                    if (typingSeconds < 60) {
                        timerEl.textContent = `${typingSeconds}s`;
                    } else {
                        const mins = Math.floor(typingSeconds / 60);
                        const secs = typingSeconds % 60;
                        timerEl.textContent = `${mins}m ${secs}s`;
                    }
                }
            }, 1000);
        }

        function stopTypingTimer() {
            if (typingTimerInterval) {
                clearInterval(typingTimerInterval);
                typingTimerInterval = null;
            }
        }

        // ── TYPING INDICATOR ─────────────────────────────
        function showTypingIndicator() {
            const container = document.getElementById('chat-messages');

            // remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = 'typing-indicator-wrapper';
            wrapper.id = 'typing-indicator';

            wrapper.innerHTML = `
                <div class="msg-label owl">
                    <i class="fas fa-crow" style="font-size:9px"></i> OWL
                </div>
                <div class="typing-bubble">
                    <div class="typing-bars">
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                        <div class="typing-bar"></div>
                    </div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span class="typing-text">Generating response...</span>
                    <span class="typing-timer" id="typing-timer" style="font-size:9px;color:var(--text-dim);margin-left:8px"></span>
                    <span class="typing-timer" id="typing-timer" style="font-size:9px;color:var(--text-dim);margin-left:8px">0s</span>
                    <button id="stop-btn-${Date.now()}" class="stop-poll-btn" 
                        style="background:transparent;border:1px solid var(--red);color:var(--red);
                        font-family:var(--font-mono);font-size:10px;padding:2px 10px;border-radius:5px;
                        cursor:pointer;display:flex;align-items:center;gap:4px;margin-left:8px;transition:all 0.15s"
                        onclick="stopPolling(this)">
                        <i class="fas fa-stop" style="font-size:9px"></i> Stop
                    </button>                    
                </div>
            `;

            container.appendChild(wrapper);
            
            // Start timer
            startTypingTimer();
            
            if (autoScrollEnabled) {
                container.scrollTop = container.scrollHeight;
            }
            return wrapper;
        }

        function removeTypingIndicator(el) {
            stopTypingTimer();
            if (el && el.parentNode) el.remove();
        }

        // ── MESSAGE BUBBLE ───────────────────────────────
        function appendMessageBubble(role, content, messageId = null) {
            const container = document.getElementById('chat-messages');

            // remove empty state
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${role}`;
            if (messageId) wrapper.id = `msg-${messageId}`;

            // Generate timestamp
            const now = new Date();
            const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const fullTimestamp = now.toISOString();

            if (role === 'user') {
                const isLong = content.length > 300;
                const bubbleClass = isLong ? 'msg-bubble-user collapsed' : 'msg-bubble-user';
                
                wrapper.innerHTML = `
                    <div class="msg-label you">
                        <i class="fas fa-user" style="font-size:8px"></i> You
                    </div>
                    <div class="${bubbleClass}" style="position:relative">
                        ${escapeHtml(content)}
                    </div>
                    ${isLong ? `
                        <button class="show-more-btn" onclick="toggleShowMore(this)">
                            <i class="fas fa-chevron-down" style="font-size:8px"></i> Show More
                        </button>
                    ` : ''}
                    <div class="msg-timestamp" data-time="${fullTimestamp}">${timestamp}</div>
                    <div class="msg-actions">
                        <button class="msg-action-btn" onclick="editMessage(this)" title="Edit">
                            <i class="fas fa-edit" style="font-size:9px"></i> Edit
                        </button>
                        <button class="msg-action-btn" onclick="copyUserMessage(this)" title="Copy">
                            <i class="far fa-copy" style="font-size:9px"></i> Copy
                        </button>
                        <button class="msg-action-btn" onclick="retryMessage(this)" title="Retry">
                            <i class="fas fa-redo" style="font-size:9px"></i> Retry
                        </button>
                    </div>
                `;
            } else {
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'msg-bubble-assistant markdown-body';
                bubbleDiv.innerHTML = marked.parse(content);
